name: Rust and tooling
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features ownnet -- -D warnings
      - run: cargo clippy --all-targets --features legacy -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features ownnet
      - run: cargo test --locked --features legacy --lib
      - run: cargo build --release --locked
      - run: pip install chess==1.10.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  # The release instruction set (AVX2 / BMI2 / PEXT kernels) must pass the
  # same tests as the portable build.
  x86-64-v3:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: grep -qw bmi2 /proc/cpuinfo && grep -qw avx2 /proc/cpuinfo
      - run: cargo clippy --all-targets --features ownnet -- -D warnings
      - run: cargo test --locked --features ownnet
      - run: cargo test --locked
  experimental-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo clippy --all-targets --features nnue-stack -- -D warnings
      - run: cargo test --locked --features nnue-stack
      - run: cargo build --release --locked --features nnue-stack
  # Reproducible competition binaries (pinned toolchain; compare SHA256SUMS
  # with docs/RELEASE-0.5.md).
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-gnu
      # Canonical's mirrors have been unreachable from runners at times; the
      # script falls back to other official Ubuntu mirrors (same packages).
      - name: Install mingw-w64
        timeout-minutes: 40
        run: tools/ci_install_mingw.sh
      - run: tools/build_release.sh dist
      - run: pip install chess==1.10.0
      - run: python3 tools/release_check.py --quick --expect-name "Farzin 0.5.2" --expect-sha256 3ec5aa7e6c16b1ea6bd366ad873f4b649da310c91204915000bfd5f1e90ebfc0 dist/farzin-*-linux-x64-avx2-bmi2
      - name: Repeat builds from a different source directory
        run: |
          mkdir ../farzin-rebuild
          git archive HEAD | tar -x -C ../farzin-rebuild
          (cd ../farzin-rebuild && tools/build_release.sh dist)
          diff dist/SHA256SUMS ../farzin-rebuild/dist/SHA256SUMS
      - name: Compare against the published 0.5.1 source
        run: |
          git fetch origin tag v0.5.1
          git worktree add --detach ../farzin-0.5.1 v0.5.1
          (cd ../farzin-0.5.1 && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --locked --features ownnet --bin farzin)
          python3 tools/compare_release.py ../farzin-0.5.1/target/release/farzin dist/farzin-0.5.2-linux-x64-avx2-bmi2 --json dist/equivalence-0.5.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: farzin-release-candidate
          path: dist/
  # Regression tests on real Windows: unit/integration tests (MSVC) and the
  # release executable built above, run natively.
  windows:
    needs: release-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --features ownnet
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
      - uses: actions/download-artifact@v4
        with:
          name: farzin-release-candidate
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess==1.10.0
      - shell: bash
        timeout-minutes: 25
        run: |
          exe=$(ls dist/farzin-*-windows-x64-avx2-bmi2.exe)
          (cd dist && sha256sum -c SHA256SUMS --ignore-missing)
          for binary in dist/*.exe; do
            "$binary" --version
            "$binary" bench | tee bench.txt
            grep -q '^992681 nodes ' bench.txt
            python tools/release_check.py --quick --expect-name "Farzin 0.5.2" --expect-sha256 3ec5aa7e6c16b1ea6bd366ad873f4b649da310c91204915000bfd5f1e90ebfc0 "$binary"
          done
          "$exe" --version
          python tools/release_check.py --expect-name "Farzin 0.5.2" --expect-sha256 3ec5aa7e6c16b1ea6bd366ad873f4b649da310c91204915000bfd5f1e90ebfc0 --json release-check-windows.json "$exe"
          python tools/arena.py --engine name=a,cmd=$exe --engine name=b,cmd=$exe \
            --tc 40/8 --pairs 4 --concurrency 2 --book tools/books/farzin-openings.epd \
            --time-margin 0 --out selfplay-windows.json
          python tools/arena.py --engine name=a,cmd=$exe --engine name=b,cmd=$exe \
            --tc 3+0.05 --pairs 4 --concurrency 2 --threads 2 --book tools/books/farzin-openings.epd \
            --time-margin 0 --out selfplay-windows-blitz.json
          # New net vs the previous OwnNet net (fzn2-a1) on native Windows.
          # The same exe with EvalFile=fzn2-a1 searches exactly like the
          # 0.5.0 release (identical bench signature, 943892 nodes).
          python tools/arena.py --engine name=b1,cmd=$exe \
            --engine name=a1,cmd=$exe,opt.EvalFile=nets/fzn2-a1.nnue \
            --tc 10+0.1 --pairs 12 --concurrency 2 --hash 64 --book tools/books/farzin-openings.epd \
            --time-margin 0 --out b1-vs-a1-windows.json
          python - <<'PY'
          import json, sys
          bad = 0
          for f in ("selfplay-windows.json", "selfplay-windows-blitz.json", "b1-vs-a1-windows.json"):
              d = json.load(open(f))
              print(f, d["terminations"], d["engine_stats"], d.get("summary"))
              bad += sum(v for k, v in d["terminations"].items()
                         if k == "time forfeit" or k.startswith(("crash", "illegal")))
          sys.exit(1 if bad else 0)
          PY
          # every engine process must have exited after quit
          sleep 2
          if tasklist | grep -i "farzin-"; then echo "engine process left running"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            release-check-windows.json
            selfplay-windows*.json
            b1-vs-a1-windows.json
